spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.jpa.show-sql=true

# Секрет подписи JWT для тестов. В application.yml у wolf.jwt.secret намеренно нет
# значения по умолчанию (приложение не должно стартовать на общеизвестном ключе),
# поэтому тестовый профиль обязан задать своё значение — иначе контекст Spring
# не поднимается с ошибкой резолва плейсхолдера ${WOLF_JWT_SECRET}.
# Значение фиктивное, используется только в памяти тестового процесса.
wolf.jwt.secret=test-only-secret-not-used-anywhere-outside-tests-32b+
