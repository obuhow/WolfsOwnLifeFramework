spring:
  application:
    name: wolf-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/wolf}
    username: ${SPRING_DATASOURCE_USERNAME:wolf}
    password: ${SPRING_DATASOURCE_PASSWORD:wolf}
  jpa:
    open-in-view: false
    hibernate:
      # Scaffold: no migrations yet. Later tickets switch to validate + Flyway.
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: never

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  health:
    db:
      enabled: true
