spring:
  application:
    name: wolf-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/wolf}
    username: ${SPRING_DATASOURCE_USERNAME:wolf}
    password: ${SPRING_DATASOURCE_PASSWORD:wolf}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  sql:
    init:
      mode: never

wolf:
  jwt:
    # Ключ подписи токенов. Значения по умолчанию нет намеренно: приложение
    # не должно стартовать на общеизвестном ключе. Задаётся через .env
    # (переменная WOLF_JWT_SECRET), см. .env.example.
    secret: ${WOLF_JWT_SECRET}
    expiration-ms: ${WOLF_JWT_EXPIRATION_MS:86400000}
  agent:
    cron: ${WOLF_AGENT_CRON:0 0 4 * * *}
  llm:
    enabled: ${WOLF_LLM_ENABLED:false}
    url: ${WOLF_LLM_URL:https://api.x.ai/v1}
    api-key: ${WOLF_LLM_API_KEY:}
    model: ${WOLF_LLM_MODEL:grok-3-mini}
    audio-directory: ${WOLF_AUDIO_DIRECTORY:${user.home}/.wolf/audio}
  demo:
    rate-per-ip-per-hour: 3
    max-live-accounts: 200
    ttl-hours: 24
    gc-enabled: false

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  health:
    db:
      enabled: true
