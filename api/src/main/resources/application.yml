spring:
  application:
    name: wolf-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/wolf}
    username: ${SPRING_DATASOURCE_USERNAME:wolf}
    password: ${SPRING_DATASOURCE_PASSWORD:wolf}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  sql:
    init:
      mode: never

wolf:
  agent:
    cron: ${WOLF_AGENT_CRON:0 0 4 * * *}
  llm:
    enabled: ${WOLF_LLM_ENABLED:false}
    url: ${WOLF_LLM_URL:https://api.x.ai/v1}
    api-key: ${WOLF...EY:}
    model: ${WOLF_LLM_MODEL:grok-3-mini}
    audio-directory: ${WOLF_AUDIO_DIRECTORY:${user.home}/.wolf/audio}
  demo:
    rate-per-ip-per-hour: 3
    max-live-accounts: 200
    ttl-hours: 24
    gc-enabled: false
  telegram:
    # Telegram import channel (release 0.7, ticket 03). Set via env in prod.
    bot-username: ${WOLF_TELEGRAM_BOT_USERNAME:}
    bot-token: ${WOLF_TELEGRAM_BOT_TOKEN:}
    secret-token: ${WOLF_TELEGRAM_SECRET_TOKEN:}
    api-base: ${WOLF_TELEGRAM_API_BASE:https://api.telegram.org}
  import-bot:
    # Per-user daily cap on LLM parse requests across all import channels (point 6).
    daily-limit-per-user: ${WOLF_IMPORT_BOT_DAILY_LIMIT:20}

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  health:
    db:
      enabled: true
