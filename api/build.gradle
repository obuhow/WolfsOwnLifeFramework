plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.4'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'ru.wolf'
version = '0.6.0'

// SPDX-License-Identifier: AGPL-3.0-only (см. LICENSE в корне репозитория)

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Repo-root assets/ is the single source of truth for demo profile JSON
// (ticket 01, release 0.6). Expose it on the runtime classpath so
// assets/profiles/<slug>.json resolves as classpath resource profiles/<slug>.json.
sourceSets {
    main {
        resources {
            srcDir "${rootDir}/../assets"
        }
    }
}

repositories {
    mavenCentral()
}

// Docker Engine 29 rejects docker-java API < 1.44; Boot 3.4 BOM pins TC 1.20.x.
ext {
    set('testcontainers.version', '1.21.4')
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    implementation 'io.jsonwebtoken:jjwt-impl:0.12.6'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    implementation 'org.flywaydb:flyway-core:11.10.0'
    implementation 'org.flywaydb:flyway-database-postgresql:11.10.0'
    implementation 'org.apache.poi:poi-ooxml:5.4.1'
    compileOnly 'org.projectlombok:lombok:1.18.36'
    annotationProcessor 'org.projectlombok:lombok:1.18.36'

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webflux'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.springframework.security:spring-security-test'
    testCompileOnly 'org.projectlombok:lombok:1.18.36'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.36'
    testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
    useJUnitPlatform()

    // Секрет подписи JWT для тестов. В application.yml у wolf.jwt.secret намеренно нет
    // значения по умолчанию (приложение не должно стартовать на общеизвестном ключе),
    // поэтому переменную обязан задать тестовый запуск — иначе контекст Spring падает
    // на резолве плейсхолдера. Задаётся здесь, а не только в application-test.properties,
    // потому что базовый ApiIntegrationTest не объявляет @ActiveProfiles("test") и
    // тестовый profile-файл для большинства тестов не подхватывается.
    // Значение фиктивное и живёт только внутри тестового процесса.
    environment 'WOLF_JWT_SECRET', 'test-only-secret-not-used-anywhere-outside-tests-32b+'
}
