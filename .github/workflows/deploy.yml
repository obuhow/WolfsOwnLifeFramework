name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build release artifacts on GitHub runner
        run: |
          cd api
          ./gradlew bootJar --no-daemon
          cd ../web
          npm ci
          npm run build
          cd ..
          tar -czf wolf-artifacts.tar.gz api/build/libs web/dist
          ls -lh wolf-artifacts.tar.gz

      - name: Configure SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Copy artifacts and deploy on VPS
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          timeout 30s ssh-keyscan -T 10 -H "$SSH_HOST" >> ~/.ssh/known_hosts
          SSH_OPTS="-o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=3"
          timeout 15m scp $SSH_OPTS wolf-artifacts.tar.gz \
            "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/wolf-artifacts.tar.gz"
          timeout 15m ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" \
            "bash -s -- $(printf '%q' "$DEPLOY_PATH")" <<'REMOTE_SCRIPT'
          set -euo pipefail
          DEPLOY_PATH="$1"
          cd "$DEPLOY_PATH"
          trap 'rm -f wolf-artifacts.tar.gz' EXIT
          git fetch origin
          git checkout main
          git pull --ff-only origin main
          tar -xzf wolf-artifacts.tar.gz
          docker compose down
          docker compose build api web
          docker compose up -d --no-build
          docker compose ps
          docker image prune -f
          curl --fail --silent --show-error --retry 20 --retry-delay 3 http://localhost:8082/actuator/health
          curl --fail --silent --show-error --retry 20 --retry-delay 3 http://localhost/
          echo "Deploy completed"
          REMOTE_SCRIPT

      - name: Clean up local artifact
        if: always()
        run: rm -f wolf-artifacts.tar.gz
