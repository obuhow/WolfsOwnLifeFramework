name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build release artifacts
        run: |
          cd api
          ./gradlew bootJar --no-daemon
          cd ../web
          npm ci
          npm run build
          cd ..

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish production images
        run: |
          docker compose build api web
          docker tag ghcr.io/obuhow/wolfsownlifeframework-api:latest ghcr.io/obuhow/wolfsownlifeframework-api:${{ github.sha }}
          docker tag ghcr.io/obuhow/wolfsownlifeframework-web:latest ghcr.io/obuhow/wolfsownlifeframework-web:${{ github.sha }}
          docker push ghcr.io/obuhow/wolfsownlifeframework-api:latest
          docker push ghcr.io/obuhow/wolfsownlifeframework-api:${{ github.sha }}
          docker push ghcr.io/obuhow/wolfsownlifeframework-web:latest
          docker push ghcr.io/obuhow/wolfsownlifeframework-web:${{ github.sha }}

      - name: Pull images and restart Compose on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin
            git checkout main
            git pull --ff-only origin main
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
            docker compose pull api web
            docker compose down
            docker compose up -d --no-build
            docker compose ps
            docker image prune -f
            curl --fail --silent --show-error --retry 20 --retry-delay 3 http://localhost:8082/actuator/health
            curl --fail --silent --show-error --retry 20 --retry-delay 3 http://localhost/
            echo "Deploy completed"
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove old local images
        if: always()
        run: docker image prune -f
