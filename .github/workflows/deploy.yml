name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 30m
          debug: true
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH }}/WolfsOwnLifeFramework
            git fetch origin
            git checkout main
            git pull --ff-only origin main
            id
            getent group docker || true
            newgrp docker <<'DOCKER_DEPLOY'
            set -euo pipefail
            docker compose --progress=plain build api web
            docker compose down
            docker compose up -d --no-build
            docker compose ps
            docker image prune -f
            curl --fail --silent --show-error --retry 30 --retry-delay 3 http://localhost:8082/actuator/health
            curl --fail --silent --show-error --retry 30 --retry-delay 3 http://localhost/
            echo "Deploy completed"
            DOCKER_DEPLOY
