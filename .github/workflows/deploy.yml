name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build release artifacts on GitHub runner
        run: |
          cd api
          ./gradlew bootJar --no-daemon
          cd ../web
          npm ci
          npm run build
          cd ..
          tar -czf wolf-artifacts.tar.gz api/build/libs web/dist
          ls -lh wolf-artifacts.tar.gz

      - name: Upload release artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: wolf-release-${{ github.sha }}
          path: wolf-artifacts.tar.gz
          retention-days: 1
          compression-level: 0

      - name: Download artifact and deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          envs: ARTIFACT_URL,GH_TOKEN
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH }}
            rm -f wolf-artifact.zip wolf-artifacts.tar.gz
            curl --fail --location --silent --show-error --retry 5 --retry-delay 5 \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              "${ARTIFACT_URL}" --output wolf-artifact.zip
            unzip -p wolf-artifact.zip wolf-artifacts.tar.gz > wolf-artifacts.tar.gz
            rm -f wolf-artifact.zip
            git fetch origin
            git checkout main
            git pull --ff-only origin main
            tar -xzf wolf-artifacts.tar.gz
            rm -f wolf-artifacts.tar.gz
            docker compose down
            docker compose build api web
            docker compose up -d --no-build
            docker compose ps
            docker image prune -f
            curl --fail --silent --show-error --retry 20 --retry-delay 3 http://localhost:8082/actuator/health
            curl --fail --silent --show-error --retry 20 --retry-delay 3 http://localhost/
            echo "Deploy completed"

        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up local artifact
        if: always()
        run: rm -f wolf-artifacts.tar.gz

      - name: Clean up remote artifact
        if: always()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 1m
          script: rm -f ${{ secrets.DEPLOY_PATH }}/wolf-artifacts.tar.gz ${{ secrets.DEPLOY_PATH }}/wolf-artifact.zip
          continue-on-error: true
