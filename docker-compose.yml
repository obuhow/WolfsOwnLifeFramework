services:
  db:
    image: postgres:16-alpine
    container_name: wolf-db
    environment:
      POSTGRES_DB: wolf
      POSTGRES_USER: wolf
      POSTGRES_PASSWORD: wolf
    ports:
      - "5434:5432"
    volumes:
      - wolf_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wolf -d wolf"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: wolf-api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/wolf
      SPRING_DATASOURCE_USERNAME: wolf
      SPRING_DATASOURCE_PASSWORD: wolf
      SERVER_PORT: 8080
    ports:
      - "8082:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: wolf-web
    ports:
      - "5174:80"
    depends_on:
      - api

volumes:
  wolf_pgdata:
