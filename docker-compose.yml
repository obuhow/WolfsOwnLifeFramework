services:
  db:
    image: postgres:16-alpine
    container_name: wolf-db
    environment:
      POSTGRES_DB: wolf
      POSTGRES_USER: wolf
      POSTGRES_PASSWORD: wolf
    ports:
      - "5434:5432"
    volumes:
      - wolf_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wolf -d wolf"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      network: host
    container_name: wolf-api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/wolf
      SPRING_DATASOURCE_USERNAME: wolf
      SPRING_DATASOURCE_PASSWORD: wolf
      SERVER_PORT: 8080
    ports:
      - "8082:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      network: host
    container_name: wolf-web
    ports:
      - "80:80"
    volumes:
      # nginx.conf вынесен в bind-mount: правка маршрутов (в т.ч. /docs)
      # применяется через `up -d --force-recreate web`, без пересборки образа.
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - docs

  docs:
    # Документация отдаётся отдельным контейнером. Контент — bind-mount:
    # правка файлов в ./docs-site/ применяется сразу, без пересборки фронта.
    image: nginx:1.27-alpine
    container_name: wolf-docs
    volumes:
      - ./docs-site:/usr/share/nginx/html:ro
    ports:
      - "8090:80"
    restart: unless-stopped

volumes:
  wolf_pgdata:
