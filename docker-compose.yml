services:
  db:
    image: postgres:16-alpine
    container_name: wolf-db-02-goals
    environment:
      POSTGRES_DB: wolf
      POSTGRES_USER: wolf
      POSTGRES_PASSWORD: wolf
    ports:
      - "5436:5432"
    volumes:
      - wolf_pgdata_02:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wolf -d wolf"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      network: host
    container_name: wolf-api-02-goals
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/wolf
      SPRING_DATASOURCE_USERNAME: wolf
      SPRING_DATASOURCE_PASSWORD: wolf
      SERVER_PORT: 8080
    ports:
      - "8084:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      network: host
    container_name: wolf-web-02-goals
    ports:
      - "5175:80"
    depends_on:
      - api

volumes:
  wolf_pgdata_02:
